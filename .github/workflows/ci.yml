name: CI

on:
  push:
  pull_request:

env:
  # The test suite truncates every table between cases, so it gets a database of
  # its own. Isolation is by name, not by port: the name is what `conftest.py`
  # refuses to run against and what decides what a stray TRUNCATE can reach.
  TEST_DATABASE_NAME: cop_test
  TEST_DATABASE_URL: postgresql+psycopg://cop:cop@127.0.0.1:5432/cop_test
  LOCAL_DB_NAME: cop_studio
  LOCAL_DB_URL: postgresql+psycopg://cop:cop@127.0.0.1:5432/cop_studio

jobs:
  schema:
    name: Schema consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: cd backend && uv sync --all-groups
      # The canonical schema, the Pydantic domain model, the reference fixture,
      # and the generated TypeScript types must agree. These are checked in CI
      # so a schema change cannot drift from its consumers unnoticed.
      - name: Validate schema, reference artifact, and Pydantic export
        working-directory: backend
        run: uv run pytest tests/test_artifact_validation.py -q
      - name: Check the packaged reference artifact against the canonical schema
        run: cd backend && uv run python ../scripts/check_reference_artifact.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A stale generated type file would let the frontend compile against a
      # schema shape the backend no longer produces.
      - name: Generated COP types are current
        run: |
          python3 scripts/generate-types.py
          if ! git diff --quiet -- packages/cop-types/generated; then
            echo "::error::packages/cop-types/generated is stale. Run the generator and commit the result."
            git diff -- packages/cop-types/generated
            exit 1
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    # A service container rather than a Compose stack: the suite needs a real
    # PostgreSQL and nothing else. Job claiming, stale-run recovery, and the
    # unique (run_id, sequence) constraint are PostgreSQL behaviour, and the V1
    # spec makes PostgreSQL the only normative database, so these tests fail
    # rather than skip when no database is reachable.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cop
          POSTGRES_PASSWORD: cop
          POSTGRES_DB: cop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cop -d cop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: cd backend && uv sync --all-groups
      - run: cd backend && uv run ruff check .
      - run: cd backend && uv run ruff format --check .
      # The service container ships psql; the runner does not. The Makefile
      # resolves psql from PATH first, so installing the client is all it needs.
      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create the test database
        run: |
          psql -h 127.0.0.1 -U cop -d postgres -tc \
            "SELECT 1 FROM pg_database WHERE datname='$TEST_DATABASE_NAME'" \
            | grep -q 1 \
            || createdb -h 127.0.0.1 -U cop "$TEST_DATABASE_NAME"
      - run: cd backend && DATABASE_URL=$TEST_DATABASE_URL uv run alembic upgrade head
      - run: cd backend && uv run pytest
        env:
          # The repository .env points DATA_DIR at a container volume; on the
          # runner that path does not exist, so tests use a temporary directory.
          TEST_DATA_DIR: /tmp/cop-studio-test-data

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # The suite drives the real stack: a Worker to turn a topic into a candidate,
    # an API that re-validates every draft write, and a browser to prove the
    # buttons are actually wired up. Unit tests cannot see that, and SSR HTML
    # cannot either. Started the same way a developer starts it, so CI exercises
    # the paths that are actually used.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cop
          POSTGRES_PASSWORD: cop
          POSTGRES_DB: cop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cop -d cop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: cd backend && uv sync --all-groups
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cop-studio/web exec playwright install --with-deps chromium
      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Start the stack
        run: |
          make local-db
          make up-local
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/v1/settings >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/v1/settings >/dev/null \
            || { echo "the stack did not come up"; make down-local; exit 1; }
      - name: Run the browser suite
        run: make test-e2e
      - if: failure()
        run: |
          tail -50 /tmp/cop-api-local.log || true
          tail -50 /tmp/cop-worker-local.log || true
          tail -50 /tmp/cop-web-local.log || true
      - if: always()
        run: make down-local
